! FW-02 - second firewall (standby), same nftables policy as fw-01. Salle reseau (MMR).
! Every link has OSPF cost 100, so all traffic goes through fw-01 while it is alive and moves here
! within the OSPF dead interval (3 s) if fw-01 fails. keepalived moves the DMZ gateway 10.10.60.1 too.
frr defaults traditional
hostname fw-02
log stdout informational
service integrated-vtysh-config
!
interface eth1
 description outside: edge-r1
 ip address 10.0.1.10/30
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf bfd
 ip ospf cost 100
exit
!
interface eth2
 description outside: edge-r2
 ip address 10.0.1.14/30
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf bfd
 ip ospf cost 100
exit
!
interface eth3
 description inside: core-01
 ip ospf mtu-ignore
 ip address 10.10.99.13/30
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf bfd
 ip ospf cost 100
exit
!
interface eth4
 description inside: core-02
 ip ospf mtu-ignore
 ip address 10.10.99.17/30
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf bfd
 ip ospf cost 100
exit
!
interface eth5
 description DMZ (VLAN 60), gateway 10.10.60.1 shared with fw-01 (keepalived VRRP 61)
 ip address 10.10.60.3/24
 ip ospf passive
 ip ospf cost 100
exit
!
interface eth6
 description state sync with the other firewall (conntrackd), not routed
 ip address 10.10.99.22/30
exit
!
router ospf
 ospf router-id 10.255.0.41
 timers throttle spf 0 50 500
 ! a firewall that (re)boots stays unattractive for 20 s, until all its adjacencies are up
 max-metric router-lsa on-startup 20
 network 10.0.1.8/29 area 0
 network 10.10.99.12/30 area 0
 network 10.10.99.16/30 area 0
 network 10.10.60.0/24 area 0
exit
!
