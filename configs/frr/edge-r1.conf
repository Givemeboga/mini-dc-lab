! EDGE-R1 - border router, Salle reseau (MMR). ISP A, PRIMARY exit.
frr defaults traditional
hostname edge-r1
log stdout informational
service integrated-vtysh-config
!
interface eth1
 description WAN to ISP-A
 ip address 10.0.0.1/30
exit
!
interface eth2
 description transit to fw-01
 ip address 10.0.1.1/30
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
! Default route to the ISP. If the ISP link dies the route disappears,
! OSPF stops advertising the default and FW-01 fails over to the other edge.
ip route 0.0.0.0/0 10.0.0.2
!
router ospf
 ospf router-id 10.255.0.31
 network 10.0.1.0/30 area 0
 ! metric 10: lower = preferred (primary ISP)
 default-information originate metric 10 metric-type 1
exit
!
