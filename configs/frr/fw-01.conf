! FW-01 - pfSense replacement: FRR (OSPF) + nftables (policy). Salle reseau (MMR).
! Active firewall; fw-02 is the standby (OSPF cost 100 on all its links).
frr defaults traditional
hostname fw-01
log stdout informational
service integrated-vtysh-config
!
interface eth1
 description outside: edge-r1
 ip address 10.0.1.2/30
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface eth2
 description outside: edge-r2
 ip address 10.0.1.6/30
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface eth3
 description inside: core-01
 ip ospf mtu-ignore
 ip address 10.10.99.1/30
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface eth4
 description inside: core-02
 ip ospf mtu-ignore
 ip address 10.10.99.5/30
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
exit
!
interface eth5
 description DMZ (VLAN 60), gateway 10.10.60.1 shared with fw-02 (keepalived VRRP 61)
 ip address 10.10.60.2/24
 ip ospf passive
exit
!
router ospf
 ospf router-id 10.255.0.40
 network 10.0.1.0/29 area 0
 network 10.10.99.0/29 area 0
 network 10.10.60.0/24 area 0
exit
!
