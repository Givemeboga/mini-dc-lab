! EDGE-R2 - border router, Salle reseau (MMR). ISP B, BACKUP exit.
frr defaults traditional
hostname edge-r2
log stdout informational
service integrated-vtysh-config
!
interface eth1
 description WAN to ISP-B
 ip address 10.0.0.5/30
exit
!
interface eth2
 description transit to fw-01
 ip address 10.0.1.5/30
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf bfd
exit
!
interface eth3
 description transit to fw-02 (standby firewall, cost 100)
 ip address 10.0.1.13/30
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
 ip ospf bfd
 ip ospf cost 100
exit
!
! Default route to the ISP. If the ISP link dies the route disappears,
! OSPF stops advertising the default and the firewalls fail over to the other edge.
ip route 0.0.0.0/0 10.0.0.6
!
router ospf
 ospf router-id 10.255.0.32
 timers throttle spf 0 50 500
 network 10.0.1.4/30 area 0
 network 10.0.1.12/30 area 0
 ! metric 20: higher = backup ISP
 default-information originate metric 20 metric-type 1
exit
!
