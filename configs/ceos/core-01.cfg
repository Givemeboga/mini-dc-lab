! =====================================================================
! CORE-01 - L3 core switch, Salle reseau (MMR), Batiment informatique
! Role: inter-VLAN routing, OSPF to FW-01. Load sharing with core-02:
!   VRRP master + MSTP root for VLAN 20/40, VRRP backup for VLAN 50/70
! =====================================================================
hostname core-01
username admin privilege 15 role network-admin secret admin
!
service routing protocols model multi-agent
!
vrf instance MGMT
   description Out-of-band management (containerlab mgmt network = VLAN 10 role)
!
spanning-tree mode mstp
!
! MST region: VLAN 20/40 (servers, backup) in instance 1, rooted on core-01.
! VLAN 50/70 (users, NOC) stay in instance 0, rooted on core-02 -> each core carries half the VLANs.
spanning-tree mst configuration
   name DC-LAB
   revision 1
   instance 1 vlan 20,40
!
spanning-tree mst 0 priority 8192
spanning-tree mst 1 priority 4096
!
vlan 20
   name SERVERS
vlan 40
   name BACKUP
vlan 50
   name USERS
vlan 70
   name MONITORING
vlan 99
   name TRANSIT-CORES
!
interface Port-Channel1
   description LACP 2x link to core-02
   switchport mode trunk
   switchport trunk allowed vlan 20,40,50,70,99
!
interface Ethernet1
   description core-02 Ethernet1 (Po1 member)
   channel-group 1 mode active
!
interface Ethernet2
   description core-02 Ethernet2 (Po1 member)
   channel-group 1 mode active
!
interface Ethernet3
   description tor-01 uplink
   switchport mode trunk
   switchport trunk allowed vlan 20,40
!
interface Ethernet4
   description tor-02 uplink
   switchport mode trunk
   switchport trunk allowed vlan 20,40
!
interface Ethernet5
   description routed link to fw-01 eth3
   no switchport
   ip address 10.10.99.2/30
   ip ospf network point-to-point
   ip ospf hello-interval 1
   ip ospf dead-interval 3
   ip ospf neighbor bfd
   bfd interval 300 min-rx 300 multiplier 3
!
interface Ethernet6
   description inter-building fiber to noc-sw (Batiment logistique)
   switchport access vlan 70
!
interface Ethernet7
   description inter-building fiber to user-sw (Batiment logistique)
   switchport access vlan 50
!
interface Ethernet8
   description routed link to fw-02 eth3 (standby firewall, OSPF cost 100)
   no switchport
   ip address 10.10.99.14/30
   ip ospf network point-to-point
   ip ospf hello-interval 1
   ip ospf dead-interval 3
   ip ospf neighbor bfd
   bfd interval 300 min-rx 300 multiplier 3
   ip ospf cost 100
!
interface Management0
   description OOB management
   vrf MGMT
   ip address 10.10.10.11/24
!
interface Vlan20
   description SERVERS gateway (VRRP VIP 10.10.20.1)
   ip address 10.10.20.2/24
   vrrp 20 priority-level 110
   vrrp 20 ipv4 10.10.20.1
!
interface Vlan40
   description BACKUP gateway (VRRP VIP 10.10.40.1)
   ip address 10.10.40.2/24
   vrrp 40 priority-level 110
   vrrp 40 ipv4 10.10.40.1
!
interface Vlan50
   description USERS gateway (VRRP VIP 10.10.50.1, backup - core-02 is master)
   ip address 10.10.50.2/24
   ip access-group USERS-IN in
   vrrp 50 ipv4 10.10.50.1
!
interface Vlan70
   description MONITORING gateway (VRRP VIP 10.10.70.1, backup - core-02 is master)
   ip address 10.10.70.2/24
   vrrp 70 ipv4 10.10.70.1
!
interface Vlan99
   description L3 transit between cores (backup path to the firewall)
   ip address 10.10.99.9/30
   ip ospf network point-to-point
   ip ospf hello-interval 1
   ip ospf dead-interval 3
!
! NOTE: cEOS-lab accepts this ACL but does not enforce it in its software data plane.
! The same policy is enforced on the servers themselves (host firewalls, role_fw in scripts/init-host.sh).
ip access-list USERS-IN
   10 permit udp 10.10.50.0/24 host 10.10.20.40 eq domain
   20 permit tcp 10.10.50.0/24 host 10.10.20.40 eq domain
   30 permit tcp 10.10.50.0/24 host 10.10.20.10 eq www
   40 permit tcp 10.10.50.0/24 host 10.10.20.20 eq 8080
   50 permit icmp 10.10.50.0/24 any
   60 deny ip 10.10.50.0/24 10.10.0.0/16
   70 permit ip 10.10.50.0/24 any
!
ip routing
ip route vrf MGMT 0.0.0.0/0 10.10.10.1
!
router ospf 1
   router-id 10.255.0.11
   passive-interface default
   no passive-interface Ethernet5
   no passive-interface Ethernet8
   no passive-interface Vlan99
   network 10.10.0.0/16 area 0.0.0.0
   max-lsa 12000
   timers spf delay initial 0 50 500
   timers lsa rx min interval 50
   timers lsa tx delay initial 0 50 500
!
snmp-server community dclab ro
snmp-server vrf MGMT
!
logging vrf MGMT host 10.10.10.110
logging vrf MGMT host 10.10.10.111
!
management api http-commands
   no shutdown
   vrf MGMT
      no shutdown
!
management ssh
   vrf MGMT
      no shutdown
!
end
