! =====================================================================
! TOR-02 - Top-of-Rack access switch, Salle serveurs 2 (Rack B)
! Role: L2 access for the rack, dual-homed to both cores, LACP to tor-01
! =====================================================================
hostname tor-02
username admin privilege 15 role network-admin secret admin
!
vrf instance MGMT
!
spanning-tree mode mstp
!
! MST region: VLAN 20/40 (servers, backup) in instance 1, rooted on core-01.
! VLAN 50/70 (users, NOC) stay in instance 0, rooted on core-02 -> each core carries half the VLANs.
spanning-tree mst configuration
   name DC-LAB
   revision 1
   instance 1 vlan 20,40
!
vlan 20
   name SERVERS
vlan 40
   name BACKUP
!
interface Port-Channel1
   description LACP 2x link to tor-01
   switchport mode trunk
   switchport trunk allowed vlan 20,40
!
interface Ethernet1
   description uplink to core-01
   switchport mode trunk
   switchport trunk allowed vlan 20,40
!
interface Ethernet2
   description uplink to core-02
   switchport mode trunk
   switchport trunk allowed vlan 20,40
!
interface Ethernet3
   description tor-01 Ethernet3 (Po1 member)
   channel-group 1 mode active
!
interface Ethernet4
   description tor-01 Ethernet4 (Po1 member)
   channel-group 1 mode active
!
interface Ethernet5
   description db01 eth1
   switchport access vlan 20
   spanning-tree portfast
!
interface Ethernet6
   description ad01 eth1
   switchport access vlan 20
   spanning-tree portfast
!
interface Ethernet7
   description backup01 eth1
   switchport access vlan 40
   spanning-tree portfast
!
interface Ethernet8
   description web02 eth1
   switchport access vlan 20
   spanning-tree portfast
!
interface Ethernet9
   description app02 eth1
   switchport access vlan 20
   spanning-tree portfast
!
interface Management0
   description OOB management
   vrf MGMT
   ip address 10.10.10.22/24
!
ip route vrf MGMT 0.0.0.0/0 10.10.10.1
!
snmp-server community dclab ro
snmp-server vrf MGMT
!
logging vrf MGMT host 10.10.10.110
logging vrf MGMT host 10.10.10.111
!
ntp server vrf MGMT 10.10.10.103 prefer
ntp server vrf MGMT 10.10.10.105
!
management api http-commands
   no shutdown
   vrf MGMT
      no shutdown
!
management ssh
   vrf MGMT
      no shutdown
!
end
